name: Build guacd (Docker + APK)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'guacd version (e.g., 1.5.5-3) - Docker format with dash'
        required: true
      release:
        description: 'APK release number (pkgrel, e.g., 1)'
        required: true
        default: '1'

env:
  REGISTRY_IMAGE: cyolosec/guacd
  PACKAGES_BUCKET: packages.cyolo.co

jobs:
  # ============================================================================
  # PHASE 1: Build info
  # ============================================================================
  build-info:
    runs-on: ubuntu-latest
    outputs:
      docker_version: ${{ steps.set-outputs.outputs.docker_version }}
      apk_version: ${{ steps.set-outputs.outputs.apk_version }}
      release: ${{ steps.set-outputs.outputs.release }}
    steps:
      - name: Set outputs
        id: set-outputs
        run: |
          # Docker version uses dash format (e.g., 1.5.5-3)
          DOCKER_VERSION="${{ github.event.inputs.version }}"
          # APK version uses dot format (e.g., 1.5.5.3)
          APK_VERSION=$(echo "$DOCKER_VERSION" | sed 's/-/./g')
          
          echo "docker_version=$DOCKER_VERSION" >> $GITHUB_OUTPUT
          echo "apk_version=$APK_VERSION" >> $GITHUB_OUTPUT
          echo "release=${{ github.event.inputs.release }}" >> $GITHUB_OUTPUT
      
      - name: Display build info
        run: |
          DOCKER_VERSION="${{ github.event.inputs.version }}"
          APK_VERSION=$(echo "$DOCKER_VERSION" | sed 's/-/./g')
          
          echo "Building guacd Docker + APK"
          echo "=================================================="
          echo "Docker Version: $DOCKER_VERSION"
          echo "APK Version: $APK_VERSION"
          echo "APK Release: ${{ github.event.inputs.release }}"
          echo "Docker Image: ${{ env.REGISTRY_IMAGE }}:$DOCKER_VERSION"
          echo "APK Architectures: aarch64, x86_64"
          echo "Branch: ${{ github.ref_name }}"
          echo "=================================================="

  # ============================================================================
  # PHASE 2: Build Docker image (multi-arch) and APKs in parallel
  # ============================================================================
  
  # --- Docker build (multi-arch in one step) ---
  build-docker:
    runs-on: ubuntu-latest
    needs: build-info
    outputs:
      digest-amd64: ${{ steps.get-digests.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.get-digests.outputs.digest-arm64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push guacd Docker Image
        id: docker-build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.REGISTRY_IMAGE }}:${{ needs.build-info.outputs.docker_version }}
          platforms: linux/amd64,linux/arm64
          push: true

      - name: Get per-architecture digests
        id: get-digests
        run: |
          IMAGE="${{ env.REGISTRY_IMAGE }}:${{ needs.build-info.outputs.docker_version }}"
          
          # Get the per-architecture digests from the manifest
          AMD64_DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "amd64"}}{{.Digest}}{{end}}{{end}}')
          ARM64_DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "arm64"}}{{.Digest}}{{end}}{{end}}')
          
          echo "digest-amd64=$AMD64_DIGEST" >> $GITHUB_OUTPUT
          echo "digest-arm64=$ARM64_DIGEST" >> $GITHUB_OUTPUT
          
          echo "AMD64 Docker digest: $AMD64_DIGEST"
          echo "ARM64 Docker digest: $ARM64_DIGEST"

  # --- APK builds per architecture ---
  build-apk-per-arch:
    needs: build-info
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Update APKBUILD version
        run: |
          cd apk
          sed -i "s/^pkgver=.*/pkgver=${{ needs.build-info.outputs.apk_version }}/" APKBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${{ needs.build-info.outputs.release }}/" APKBUILD
          
          echo "Updated APKBUILD:"
          grep -E "^(pkgver|pkgrel)=" APKBUILD
      
      - name: Build APK
        run: |
          chmod +x apk/build-apk.sh
          ./apk/build-apk.sh ${{ matrix.arch }}
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guacd-${{ needs.build-info.outputs.apk_version }}-r${{ needs.build-info.outputs.release }}-${{ matrix.arch }}
          path: /tmp/cyolo-apk-output/*.apk
          if-no-files-found: error

  # ============================================================================
  # PHASE 3: Upload APKs to S3 with Docker digest in metadata
  # ============================================================================
  upload-to-s3:
    needs: [build-info, build-docker, build-apk-per-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.apk" -exec ls -lh {} \;
          echo ""
          echo "AMD64 Docker digest: ${{ needs.build-docker.outputs.digest-amd64 }}"
          echo "ARM64 Docker digest: ${{ needs.build-docker.outputs.digest-arm64 }}"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      
      - name: Upload to S3 with Docker digest
        run: |
          DOCKER_VERSION="${{ needs.build-info.outputs.docker_version }}"
          APK_VERSION="${{ needs.build-info.outputs.apk_version }}"
          RELEASE="${{ needs.build-info.outputs.release }}"
          DIGEST_AMD64="${{ needs.build-docker.outputs.digest-amd64 }}"
          DIGEST_ARM64="${{ needs.build-docker.outputs.digest-arm64 }}"
          S3_BUCKET="${{ env.PACKAGES_BUCKET }}"
          
          # S3 structure: {component}/{version}/{arch}/ - uses APK version format
          S3_PREFIX="guacd/${APK_VERSION}"
          
          echo "Uploading to s3://${S3_BUCKET}/${S3_PREFIX}/"
          echo "AMD64 Docker digest: ${DIGEST_AMD64}"
          echo "ARM64 Docker digest: ${DIGEST_ARM64}"
          
          for apk in artifacts/*/*.apk; do
            if [ -f "$apk" ]; then
              # Extract arch from artifact directory name
              dir_name=$(dirname "$apk")
              arch=$(echo "$dir_name" | grep -oE '(aarch64|x86_64)')
              
              # Map APK arch to Docker digest
              if [ "$arch" == "x86_64" ]; then
                DOCKER_DIGEST="$DIGEST_AMD64"
              else
                DOCKER_DIGEST="$DIGEST_ARM64"
              fi
              
              filename=$(basename "$apk")
              dest_path="${S3_PREFIX}/${arch}/${filename}"
              
              echo "Uploading: $filename -> $dest_path (docker_digest: $DOCKER_DIGEST)"
              aws s3 cp "$apk" "s3://${S3_BUCKET}/${dest_path}"
              
              # Calculate full SHA256
              sha256=$(sha256sum "$apk" | awk '{print $1}')
              echo "$sha256" | aws s3 cp - "s3://${S3_BUCKET}/${dest_path}.sha256"
              
              # Create and upload metadata.json WITH per-arch docker_digest
              size_compressed=$(stat -c%s "$apk" 2>/dev/null || stat -f%z "$apk")
              cat > metadata.json << EOF
          {
            "component": "guacd",
            "version": "${APK_VERSION}",
            "release": ${RELEASE},
            "architecture": "${arch}",
            "sha256": "${sha256}",
            "docker_digest": "${DOCKER_DIGEST}",
            "size_compressed": ${size_compressed},
            "built_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
              aws s3 cp metadata.json "s3://${S3_BUCKET}/${dest_path}.metadata.json"
              echo "  Uploaded metadata with docker_digest: ${dest_path}.metadata.json"
            fi
          done
          
          echo ""
          echo "Upload complete!"
          echo "Docker Image: ${{ env.REGISTRY_IMAGE }}:${DOCKER_VERSION}"
          echo "APK Version: ${APK_VERSION}"

