name: Release guacd (Docker + APK)

on:
  workflow_dispatch:

env:
  REGISTRY_IMAGE: cyolosec/guacd
  RELEASE_BUCKET: repo.cyolo.io
  COMPONENT: guacd

jobs:
  # ============================================================================
  # PHASE 1: Read version from .source_version
  # ============================================================================
  read-version:
    runs-on: ubuntu-latest
    outputs:
      docker_version: ${{ steps.version.outputs.docker_version }}
      apk_version: ${{ steps.version.outputs.apk_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from .source_version
        id: version
        run: |
          DOCKER_VERSION=$(head -1 .source_version | tr -d '[:space:]')
          APK_VERSION=$(echo "$DOCKER_VERSION" | sed 's/-/./g')

          echo "docker_version=$DOCKER_VERSION" >> $GITHUB_OUTPUT
          echo "apk_version=$APK_VERSION" >> $GITHUB_OUTPUT

          echo "=================================================="
          echo "Releasing guacd"
          echo "  Docker version: $DOCKER_VERSION"
          echo "  APK version:    $APK_VERSION"
          echo "  Docker image:   ${{ env.REGISTRY_IMAGE }}:$DOCKER_VERSION"
          echo "  APK release:    1 (hardcoded)"
          echo "  Architectures:  aarch64, x86_64"
          echo "=================================================="

  # ============================================================================
  # PHASE 2: Build and push Docker image (idempotent - skips if tag exists)
  # ============================================================================
  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: read-version
    outputs:
      digest-amd64: ${{ steps.get-digests.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.get-digests.outputs.digest-arm64 }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check if Docker tag already exists
        id: check-docker
        run: |
          if docker manifest inspect ${{ env.REGISTRY_IMAGE }}:${{ needs.read-version.outputs.docker_version }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Docker image ${{ env.REGISTRY_IMAGE }}:${{ needs.read-version.outputs.docker_version }} already exists — skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Docker image does not exist — will build and push"
          fi

      - name: Checkout code
        if: steps.check-docker.outputs.exists != 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.check-docker.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push guacd Docker Image
        if: steps.check-docker.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.REGISTRY_IMAGE }}:${{ needs.read-version.outputs.docker_version }}
          platforms: linux/amd64,linux/arm64
          push: true

      - name: Get per-architecture digests
        id: get-digests
        run: |
          IMAGE="${{ env.REGISTRY_IMAGE }}:${{ needs.read-version.outputs.docker_version }}"

          AMD64_DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "amd64"}}{{.Digest}}{{end}}{{end}}')
          ARM64_DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "arm64"}}{{.Digest}}{{end}}{{end}}')

          echo "digest-amd64=$AMD64_DIGEST" >> $GITHUB_OUTPUT
          echo "digest-arm64=$ARM64_DIGEST" >> $GITHUB_OUTPUT

          echo "AMD64 Docker digest: $AMD64_DIGEST"
          echo "ARM64 Docker digest: $ARM64_DIGEST"

  # ============================================================================
  # PHASE 3: Build APKs and upload to S3 (idempotent - skips if APK exists)
  # ============================================================================
  build-apk-per-arch:
    needs: [read-version, build-and-push-docker]
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Check if APK already exists in S3
        id: check-apk
        run: |
          S3_PREFIX="release/${{ env.COMPONENT }}/${{ needs.read-version.outputs.apk_version }}/${{ matrix.arch }}/"
          if aws s3 ls "s3://${{ env.RELEASE_BUCKET }}/${S3_PREFIX}" 2>/dev/null | grep -q '\.apk$'; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "APK for ${{ matrix.arch }} already exists at s3://${{ env.RELEASE_BUCKET }}/${S3_PREFIX} — skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "APK for ${{ matrix.arch }} does not exist — will build and upload"
          fi

      - name: Checkout code
        if: steps.check-apk.outputs.exists != 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.check-apk.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        if: steps.check-apk.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Update APKBUILD version
        if: steps.check-apk.outputs.exists != 'true'
        run: |
          cd apk
          sed -i "s/^pkgver=.*/pkgver=${{ needs.read-version.outputs.apk_version }}/" APKBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" APKBUILD
          echo "Updated APKBUILD:"
          grep -E "^(pkgver|pkgrel)=" APKBUILD

      - name: Build APK
        if: steps.check-apk.outputs.exists != 'true'
        run: |
          chmod +x apk/build-apk.sh
          ./apk/build-apk.sh ${{ matrix.arch }}

      - name: Upload APK to S3 with metadata
        if: steps.check-apk.outputs.exists != 'true'
        run: |
          APK_VERSION="${{ needs.read-version.outputs.apk_version }}"
          ARCH="${{ matrix.arch }}"

          # Map APK arch to Docker digest
          if [ "$ARCH" == "x86_64" ]; then
            DOCKER_DIGEST="${{ needs.build-and-push-docker.outputs.digest-amd64 }}"
          else
            DOCKER_DIGEST="${{ needs.build-and-push-docker.outputs.digest-arm64 }}"
          fi

          S3_PREFIX="release/${{ env.COMPONENT }}/${APK_VERSION}/${ARCH}"

          # Find the built APK
          APK_FILE=$(find /tmp/cyolo-apk-output -name "${{ env.COMPONENT }}-*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi

          FILENAME=$(basename "$APK_FILE")
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")

          echo "Uploading ${FILENAME} to s3://${{ env.RELEASE_BUCKET }}/${S3_PREFIX}/"
          echo "  Docker digest: ${DOCKER_DIGEST}"

          # Upload APK
          aws s3 cp "$APK_FILE" "s3://${{ env.RELEASE_BUCKET }}/${S3_PREFIX}/${FILENAME}"

          # Upload SHA256
          echo "$SHA256" | aws s3 cp - "s3://${{ env.RELEASE_BUCKET }}/${S3_PREFIX}/${FILENAME}.sha256"

          # Upload metadata
          cat > metadata.json << EOF
          {
            "component": "${{ env.COMPONENT }}",
            "version": "${APK_VERSION}",
            "release": 1,
            "architecture": "${ARCH}",
            "sha256": "${SHA256}",
            "docker_digest": "${DOCKER_DIGEST}",
            "size_compressed": ${SIZE},
            "built_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          aws s3 cp metadata.json "s3://${{ env.RELEASE_BUCKET }}/${S3_PREFIX}/${FILENAME}.metadata.json"

          echo "Upload complete!"
