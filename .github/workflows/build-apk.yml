name: Build guacd APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'guacd version (e.g., 1.5.5.3)'
        required: true
        default: '1.5.5.3'
      release:
        description: 'Release number (pkgrel, e.g., 1)'
        required: true
        default: '1'

jobs:
  build-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-outputs.outputs.version }}
      release: ${{ steps.set-outputs.outputs.release }}
    steps:
      - name: Set outputs
        id: set-outputs
        run: |
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "release=${{ github.event.inputs.release }}" >> $GITHUB_OUTPUT
      
      - name: Display build info
        run: |
          echo "Building guacd APK"
          echo "=================================================="
          echo "Version: ${{ github.event.inputs.version }}"
          echo "Release: ${{ github.event.inputs.release }}"
          echo "Architectures: aarch64, x86_64"
          echo "Branch: ${{ github.ref_name }}"
          echo "=================================================="

  build-apk:
    needs: build-info
    strategy:
      matrix:
        arch: [aarch64, x86_64]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-2core-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Prepare build environment
        run: |
          echo "Building guacd APK for ${{ matrix.arch }}"
          mkdir -p output
      
      - name: Update APKBUILD version and architecture
        run: |
          cd apk
          sed -i "s/^pkgver=.*/pkgver=${{ needs.build-info.outputs.version }}/" APKBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${{ needs.build-info.outputs.release }}/" APKBUILD
          
          # Set architecture for this build
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sed -i 's/^arch=.*/arch="aarch64"/' APKBUILD
          elif [ "${{ matrix.arch }}" = "x86_64" ]; then
            sed -i 's/^arch=.*/arch="x86_64"/' APKBUILD
          fi
          
          echo "Updated APKBUILD:"
          grep -E "^(pkgver|pkgrel|arch)=" APKBUILD
      
      - name: Build APK (Docker)
        run: |
          # Use Alpine 3.18 for building (matches Dockerfile)
          docker run --rm \
            --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/src:ro \
            -v ${{ github.workspace }}/output:/output \
            -w /tmp/build \
            alpine:3.18.6 \
            sh -c '
              set -e
              
              echo "Installing build dependencies..."
              apk add --no-cache alpine-sdk abuild docker
              
              # Setup abuild
              abuild-keygen -a -n
              cp /root/.abuild/*.rsa.pub /etc/apk/keys/
              
              # Copy source
              cp -r /src/. /tmp/build/
              
              echo "Building APK..."
              cd /tmp/build/apk
              abuild -r -F
              
              # Copy result
              find /root/packages -name "*.apk" -exec cp {} /output/ \;
              
              echo "Build complete!"
              ls -lh /output/
            '
      
      - name: Verify APK
        run: |
          echo "APK Contents:"
          tar -tzf output/*.apk | head -30
          
          echo ""
          echo "APK Size:"
          ls -lh output/*.apk
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guacd-${{ needs.build-info.outputs.version }}-r${{ needs.build-info.outputs.release }}-${{ matrix.arch }}
          path: output/*.apk
          if-no-files-found: error

  upload-to-s3:
    needs: [build-info, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.apk" -exec ls -lh {} \;
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
      
      - name: Upload to S3
        run: |
          VERSION="${{ needs.build-info.outputs.version }}"
          RELEASE="${{ needs.build-info.outputs.release }}"
          S3_BUCKET="packages.cyolo.co"
          S3_PREFIX="alpine/latest"
          
          echo "Uploading to s3://${S3_BUCKET}/${S3_PREFIX}/"
          
          for apk in artifacts/*/*.apk; do
            if [ -f "$apk" ]; then
              # Extract arch from artifact directory name
              dir_name=$(dirname "$apk")
              arch=$(echo "$dir_name" | grep -oE '(aarch64|x86_64)')
              
              filename=$(basename "$apk")
              dest_path="${S3_PREFIX}/${arch}/${filename}"
              
              echo "Uploading: $filename -> $dest_path"
              aws s3 cp "$apk" "s3://${S3_BUCKET}/${dest_path}"
              
              # Calculate SHA256
              sha256=$(sha256sum "$apk" | awk '{print $1}')
              echo "$sha256" | aws s3 cp - "s3://${S3_BUCKET}/${dest_path}.sha256"
            fi
          done
          
          echo "Upload complete!"

